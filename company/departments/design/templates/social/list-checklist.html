<!doctype html>
<!--
  Flat canvas composition — ARCHETYPE: list-checklist (Threads/social image).
  Research map (shortform-template-research-20260817): step-by-step / carousel
  content performs on Threads; short snappy segments of 5-8 words per item
  (Sendible 2025-08-26; RocketShip HQ 2026-06-08). The archetype is a hook
  title over flat checklist rows with boxicon bullets — the journey signature
  line runs beside the list in the right margin. Flat only: no card-with-arrows
  website-screenshot layouts, semantic tokens, boxicons only. The list is
  centered with generous side margins; the signature is the video-style line:
  smooth bezier, dashed route + solid traveled fill, nodes on the path,
  flat bullseye.
-->
<html lang="en" data-theme="gruvbox-dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SpielOS content template</title>
  <link rel="stylesheet" href="/.agents/company/departments/design/system/production.css">
  <link rel="stylesheet" href="/.agents/company/departments/design/system/journey-signature.css">
  <link rel="stylesheet" href="../tools/vendor/boxicons/css/boxicons.min.css">
  <style>
    body { container-type: size; display: grid; place-items: center; }
    .canvas { position: relative; width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr auto; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 44%, var(--primary-soft), transparent 46%), var(--background); }
    .grid { position: absolute; inset: 0; opacity: .03; background-image: linear-gradient(var(--foreground) 1px, transparent 1px), linear-gradient(90deg, var(--foreground) 1px, transparent 1px); background-size: 5cqw 5cqw; }
    header, main, footer { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
    header { margin-top: 6cqh; }
    .eyebrow { color: var(--primary); font: 600 clamp(13px, 2.1cqw, 30px)/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
    main { gap: 2.6cqh; width: 100%; }
    h1 { max-width: 18ch; margin: 0; text-align: center; color: var(--foreground-strong); font-size: clamp(40px, 6.4cqw, 104px); font-weight: 800; line-height: .98; letter-spacing: -.045em; }
    h1 .accent { color: var(--primary); }
    /* Checklist: flat rows, boxicon bullets, 5-8 words per item, no cards.
       Centered with real side margins — the list never starts at the edge. */
    .checklist { width: 100%; max-width: 76cqw; display: flex; flex-direction: column; gap: 1.6cqh; margin-top: 1cqh; padding-inline: 2cqw; }
    .check-row { display: flex; align-items: center; gap: 1.4cqw; padding: 1.4cqh 1cqw; border-bottom: 1px solid var(--border); }
    .check-row:last-child { border-bottom: none; }
    .check-row i { color: var(--primary); font-size: clamp(18px, 2.4cqw, 34px); flex-shrink: 0; }
    .check-row span { color: var(--foreground); font: 600 clamp(17px, 2cqw, 30px)/1.2 var(--font-sans); text-align: left; }
    footer { margin-bottom: 5cqh; color: var(--muted-foreground); font: 500 clamp(20px, 1.7cqw, 26px)/1 var(--font-mono); }
    @media (orientation: portrait) {
      .checklist { max-width: 76cqw; }
    }
    @container (aspect-ratio > 8/5) {
      header { margin-top: 4cqh; }
      main { flex-direction: row; align-items: center; justify-content: center; gap: 5cqw; width: 90%; }
      h1 { max-width: 11ch; font-size: clamp(40px, 5.2cqw, 84px); }
      .checklist { max-width: 44cqw; margin-top: 0; padding-inline: 1.5cqw; }
    }
    @container (aspect-ratio <= 4/5) {
      header { margin-top: 8cqh; }
      main { gap: 3cqh; }
      h1 { font-size: clamp(44px, 8.4cqw, 92px); }
      .checklist { max-width: 76cqw; }
      .check-row { padding: 1.8cqh 1.2cqw; }
      .check-row i { font-size: clamp(24px, 3.2cqw, 36px); }
      .check-row span { font-size: clamp(20px, 2.6cqw, 30px); }
      footer { margin-bottom: 7cqh; }
    }
  </style>
</head>
<body>
<div class="canvas">
  <div class="grid"></div>

  <!-- Journey signature — right-edge vertical wave (portrait), bottom band
       wave (landscape). Nodes ride the path; no labels — the checklist rows
       carry the vocabulary. -->
  <svg class="journey-svg journey-portrait" viewBox="0 0 1080 1350" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path class="journey-path" d="M1040,70 C1000,240 1070,320 1020,500 C985,640 1065,720 1015,900 C990,1060 1050,1160 1020,1300"/>
    <path class="journey-path-fill" d="M1040,70 C1000,240 1070,320 1020,500"/>
    <g class="journey-node" transform="translate(1020,500)"><circle class="node-ring" r="16"/><circle class="node-dot" r="7"/></g>
    <g class="journey-node" transform="translate(1015,900)"><circle class="node-ring" r="16"/><circle class="node-dot" r="7"/></g>
    <g class="journey-goal" transform="translate(1020,1300)">
      <circle class="goal-ring" r="30"/><circle class="goal-ring-inner" r="17"/><circle class="goal-core" r="6"/>
    </g>
  </svg>
  <svg class="journey-svg journey-landscape" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path class="journey-path" d="M20,800 C200,660 400,820 600,720 C800,620 1000,800 1200,700 C1300,650 1450,720 1560,700"/>
    <path class="journey-path-fill" d="M20,800 C200,660 400,820 600,720"/>
    <g class="journey-node" transform="translate(600,720)"><circle class="node-ring" r="16"/><circle class="node-dot" r="7"/></g>
    <g class="journey-node" transform="translate(1200,700)"><circle class="node-ring" r="16"/><circle class="node-dot" r="7"/></g>
    <g class="journey-goal" transform="translate(1560,700)">
      <circle class="goal-ring" r="30"/><circle class="goal-ring-inner" r="17"/><circle class="goal-core" r="6"/>
    </g>
  </svg>

  <header>
    <div class="eyebrow" id="template-eyebrow">Campaign context required</div>
  </header>

  <main>
    <h1 class="canvas-title" id="template-title">Campaign title required</h1>
    <div class="checklist" id="checklist">
      <div class="check-row"><i class="bx bx-check-square"></i><span>Campaign row one</span></div>
      <div class="check-row"><i class="bx bx-check-square"></i><span>Campaign row two</span></div>
      <div class="check-row"><i class="bx bx-check-square"></i><span>Campaign row three</span></div>
      <div class="check-row"><i class="bx bx-check-square"></i><span>Campaign row four</span></div>
      <div class="check-row"><i class="bx bx-check-square"></i><span>Campaign row five</span></div>
    </div>
  </main>

  <footer><span class="brand-lockup"><img src="/public/assets/favicons/favicon.svg" alt="">spielos.xyz</span></footer>
</div>
<script>
  (function () {
    function applyRendition(order) {
      if (!order || !order.design || !Array.isArray(order.design.title_lines)) {
        document.documentElement.dataset.templateReady = 'error';
        throw new Error('A typed campaign rendition is required');
      }
      var design = order.design;
      document.documentElement.dataset.theme = design.theme;
      document.body.dataset.layout = design.layout;
      document.body.dataset.campaignId = order.campaign_id;
      document.body.dataset.batchId = order.batch_id;
      document.body.dataset.itemId = order.item_id;
      document.body.dataset.contentId = order.content_id;
      document.getElementById('template-eyebrow').textContent = design.eyebrow;
      document.getElementById('template-title').innerHTML = design.title_lines.map(function (line, index) {
          var text = line.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return index === design.accent_line ? '<span class="accent">' + text + '</span>' : text;
      }).join('<br>');
      // The checklist rows ARE the journey vocabulary (station_labels), so the
      // list and the line stay one shared source.
      var rows = document.querySelectorAll('.check-row span');
      var labels = design.station_labels || [];
      rows.forEach(function (row, index) {
        row.textContent = labels[index] || row.textContent;
      });
      document.title = 'SpielOS — ' + design.title_lines.join(' ');
      document.documentElement.dataset.templateReady = 'true';
    }
    window.__applyCampaignRendition = applyRendition;
    document.documentElement.dataset.templateReady = 'waiting';
  }());
</script>
</body>
</html>
