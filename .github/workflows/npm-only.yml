name: Publish to npm (standalone, OIDC)
on:
  workflow_dispatch:
jobs:
  npm-publish:
    name: Publish to npm via OIDC
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # GitHub mints a short-lived publish credential; no NPM_TOKEN needed
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"   # required for the OIDC token exchange
      - name: Ensure npm >= 11.5.1 (OIDC minimum)
        run: npm install -g npm@^11.5.1
      - name: Publish to npm with provenance (tokenless OIDC)
        run: npm publish --provenance --access public
