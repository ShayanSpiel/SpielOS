name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    name: Full acceptance suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Run the test suite
        run: |
          set -euo pipefail
          python3 -B tools/check_source_boundary.py
          python3 -B tools/sync_runtime_templates.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s company/tests -t .
          python3 -B tools/test_acceptance.py --out "$RUNNER_TEMP/acceptance.json"

  pypi-publish:
    name: Build and publish
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      id-token: write          # Trusted Publishing — no API token stored
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from company.runtime.config import VERSION; print(VERSION)')"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TEMPLATE_VERSION="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' company/init_templates/agents/company/runtime/config.py)"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$TEMPLATE_VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build sdist + wheel
        run: pipx run build
      - name: Check distributions
        shell: bash
        run: |
          set -euo pipefail
          pipx run twine check dist/*
      - name: Verify installed wheel and fresh clean home
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/spielos-smoke"
          "$RUNNER_TEMP/spielos-smoke/bin/python" -m pip install dist/*.whl
          python -B tools/smoke_distribution.py \
            --python "$RUNNER_TEMP/spielos-smoke/bin/python" \
            --expected "${{ steps.release.outputs.version }}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm-publish:
    if: github.event_name != 'workflow_dispatch'
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check whether this version is already published
        id: npm-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "spielos@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "spielos@${VERSION} is already published; skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npm-version.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  homebrew-publish:
    if: github.event_name != 'workflow_dispatch'
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: write
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute sdist sha256 and update formula
        id: dist
        run: |
          set -euo pipefail
          VERSION="${{ needs.pypi-publish.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python - "$VERSION" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import time
          import urllib.request

          version, output_path = sys.argv[1:]
          metadata_url = f"https://pypi.org/pypi/spielos/{version}/json"
          metadata = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(metadata_url) as response:
                      metadata = json.load(response)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
          sdist = next(item for item in metadata["urls"] if item["packagetype"] == "sdist")
          with urllib.request.urlopen(sdist["url"]) as response:
              archive = response.read()
          digest = hashlib.sha256(archive).hexdigest()
          if digest != sdist["digests"]["sha256"]:
              raise SystemExit("PyPI sdist checksum mismatch")
          pathlib.Path("spielos.tar.gz").write_bytes(archive)
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"url={sdist['url']}\n")
              output.write(f"sha256={digest}\n")
          print(f"Resolved {sdist['url']} with sha256={digest}")
          PY
      - name: Inject computed sha256 into formula
        run: |
          set -euo pipefail
          sed -i.bak -E 's|^  url ".*"|  url "${{ steps.dist.outputs.url }}"|' homebrew/spielos.rb
          sed -i.bak "s|sha256 \".*\"|sha256 \"${{ steps.dist.outputs.sha256 }}\"|" homebrew/spielos.rb
          rm -f homebrew/spielos.rb.bak
          grep -q "${{ steps.dist.outputs.sha256 }}" homebrew/spielos.rb \
            && echo "sha256 injected into homebrew/spielos.rb"
      - name: Push updated formula to tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          source-directory: "homebrew"
          destination-github-username: "ShayanSpiel"
          destination-repository-name: "homebrew-spielos"
          target-branch: "main"
          commit-message: "spielos ${{ steps.dist.outputs.version }}"
      - name: Record manual tap update requirement
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not configured; update ShayanSpiel/homebrew-spielos from the verified PyPI metadata."

  docker-publish:
    if: github.event_name != 'workflow_dispatch'
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: read
      packages: write         # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SPIELOS_VERSION=${{ needs.pypi-publish.outputs.version }}
          tags: |
            ghcr.io/shayanspiel/spielos:latest
            ghcr.io/shayanspiel/spielos:v${{ needs.pypi-publish.outputs.version }}
