name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      id-token: write          # Trusted Publishing — no API token stored
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from company.runtime.config import VERSION; print(VERSION)')"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TEMPLATE_VERSION="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' company/init_templates/agents/company/runtime/config.py)"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$TEMPLATE_VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build sdist + wheel
        run: pipx run build
      - name: Check distributions
        shell: bash
        run: |
          set -euo pipefail
          pipx run twine check dist/*
      - name: Verify installed wheel and fresh clean home
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/spielos-smoke"
          "$RUNNER_TEMP/spielos-smoke/bin/python" -m pip install dist/*.whl
          SMOKE_HOME="$RUNNER_TEMP/spielos-home"
          "$RUNNER_TEMP/spielos-smoke/bin/spielos" init --dir "$SMOKE_HOME" -y
          (
            cd "$SMOKE_HOME"
            "$RUNNER_TEMP/spielos-smoke/bin/spielos"
            "$RUNNER_TEMP/spielos-smoke/bin/spielos" status
            "$RUNNER_TEMP/spielos-smoke/bin/spielos" overview
            "$RUNNER_TEMP/spielos-smoke/bin/spielos" context
            "$RUNNER_TEMP/spielos-smoke/bin/spielos" memory summary
            "$RUNNER_TEMP/spielos-smoke/bin/spielos" profile list
            "$RUNNER_TEMP/spielos-smoke/bin/spielos" runner tick
          )
          EXPECTED="${{ steps.release.outputs.version }}" SMOKE_HOME="$SMOKE_HOME" \
          "$RUNNER_TEMP/spielos-smoke/bin/python" - "$SMOKE_HOME" <<'PY'
          import os
          import re
          import sqlite3
          import subprocess
          import sys
          from pathlib import Path

          home = Path(sys.argv[1])
          config = (home / ".agents/company/runtime/config.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION\s*=\s*"([^"]+)"', config, re.MULTILINE)
          actual = match.group(1) if match else None
          expected = os.environ["EXPECTED"]
          assert actual == expected, (actual, expected)
          expected_tables = {
              "core_goals", "core_goal_metadata", "core_goal_edges", "core_runs",
              "core_interventions", "core_workflows", "core_workflow_runs",
              "core_work_orders", "core_evidence", "core_memory", "core_approvals",
              "core_notifications",
          }
          database = home / ".spielos/state/company.sqlite"
          with sqlite3.connect(database) as connection:
              actual_tables = {row[0] for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'")}
          assert actual_tables == expected_tables, actual_tables
          command = Path(sys.executable).with_name("spielos")
          reported = subprocess.check_output(
              [command, "--version"], cwd=home, text=True).strip()
          assert reported == f"spielos {expected}", reported
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm-publish:
    name: Publish to npm via trusted publishing
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      id-token: write          # npm OIDC provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Check whether this version is already published
        id: npm-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "spielos@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "spielos@${VERSION} is already published; skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with provenance
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --provenance --access public

  homebrew-publish:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: write
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute sdist sha256 and update formula
        id: dist
        run: |
          set -euo pipefail
          VERSION="${{ needs.pypi-publish.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python - "$VERSION" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import time
          import urllib.request

          version, output_path = sys.argv[1:]
          metadata_url = f"https://pypi.org/pypi/spielos/{version}/json"
          metadata = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(metadata_url) as response:
                      metadata = json.load(response)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
          sdist = next(item for item in metadata["urls"] if item["packagetype"] == "sdist")
          with urllib.request.urlopen(sdist["url"]) as response:
              archive = response.read()
          digest = hashlib.sha256(archive).hexdigest()
          if digest != sdist["digests"]["sha256"]:
              raise SystemExit("PyPI sdist checksum mismatch")
          pathlib.Path("spielos.tar.gz").write_bytes(archive)
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"url={sdist['url']}\n")
              output.write(f"sha256={digest}\n")
          print(f"Resolved {sdist['url']} with sha256={digest}")
          PY
      - name: Inject computed sha256 into formula
        run: |
          set -euo pipefail
          sed -i.bak -E 's|^  url ".*"|  url "${{ steps.dist.outputs.url }}"|' homebrew/spielos.rb
          sed -i.bak "s|sha256 \".*\"|sha256 \"${{ steps.dist.outputs.sha256 }}\"|" homebrew/spielos.rb
          rm -f homebrew/spielos.rb.bak
          grep -q "${{ steps.dist.outputs.sha256 }}" homebrew/spielos.rb \
            && echo "sha256 injected into homebrew/spielos.rb"
      - name: Push updated formula to tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          source-directory: "homebrew"
          destination-github-username: "ShayanSpiel"
          destination-repository-name: "homebrew-spielos"
          target-branch: "main"
          commit-message: "spielos ${{ steps.dist.outputs.version }}"
      - name: Record manual tap update requirement
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not configured; update ShayanSpiel/homebrew-spielos from the verified PyPI metadata."

  docker-publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: read
      packages: write         # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shayanspiel/spielos:latest
            ghcr.io/shayanspiel/spielos:v${{ needs.pypi-publish.outputs.version }}
