[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spielos"
description = "Turn recurring business work into reusable AI workflows with company context, evaluation and review."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["version"]
authors = [{ name = "Shayan Spiel" }]
keywords = ["ai-agents", "agent-harness", "company-runtime", "spielos"]

[project.optional-dependencies]
test = ["Pillow>=10,<13"]

[project.scripts]
spielos = "company.cli:main"

[project.urls]
Homepage = "https://spielos.xyz"

[tool.setuptools.packages.find]
include = ["company*"]
exclude = ["company.tests*", "company.init_templates*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.css", "*.js", "*.html", "*.png", "*.woff2", ".env.example"]
company = [
    "init_templates/**/*",
    "dot-env-example",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.setuptools.dynamic]
version = { attr = "company.runtime.config.VERSION" }
