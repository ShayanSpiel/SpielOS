[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spielos"
description = "SpielOS: one durable Goal loop, Departments, approvals, evidence, and evals for operating AI work as a company system."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dynamic = ["version"]
authors = [{ name = "Shayan Spiel" }]
keywords = ["ai-agents", "agent-harness", "company-runtime", "spielos"]

[project.scripts]
spielos = "company.cli:main"

[project.urls]
Homepage = "https://spielos.xyz"

[tool.setuptools.packages.find]
include = ["company*"]
exclude = ["company.tests*", "company.init_templates*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.css", "*.html", ".env.example"]
company = [
    "init_templates/**/*",
    "dot-env-example",
    "skills/**/*",
    "departments/*/skills/**/*",
    "departments/_shared/skills/**/*",
    "departments/design/tools/**/*",
    "departments/design/tokens/*.css",
]

[tool.setuptools.dynamic]
version = { attr = "company.runtime.config.VERSION" }
