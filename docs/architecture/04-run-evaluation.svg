e</text><text x="380.0" y="343" text-anchor="middle" font-size="13" fill="#46554c">separate action approval</text><rect x="170" y="485" width="210" height="100" rx="8" fill="#f2efff" stroke="#b8a9de" stroke-width="2"/><text x="275.0" y="516" text-anchor="middle" font-size="17" font-weight="700" fill="#605397">Release-only exception</text><text x="275.0" y="539" text-anchor="middle" font-size="13" fill="#46554c">qualified deterministic policy</text><text x="275.0" y="558" text-anchor="middle" font-size="13" fill="#46554c">no per-run review</text><rect x="800" y="485" width="210" height="100" rx="8" fill="#fff1e9" stroke="#e5b19a" stroke-width="2"/><text x="905.0" y="516" text-anchor="middle" font-size="17" font-weight="700" fill="#a64c30">Failed / awaiting</text><text x="905.0" y="539" text-anchor="middle" font-size="13" fill="#46554c">fail → failed</text><text x="905.0" y="558" text-anchor="middle" font-size="13" fill="#46554c">missing → awaiting eval</text><rect x="1070" y="485" width="210" height="100" rx="8" fill="#f2efff" stroke="#b8a9de" stroke-width="2"/><text x="1175.0" y="516" text-anchor="middle" font-size="17" font-weight="700" fill="#605397">Human / model verdict</text><text x="1175.0" y="539" text-anchor="middle" font-size="13" fill="#46554c">attribution + artifact digest</text><text x="1175.0" y="558" text-anchor="middle" font-size="13" fill="#46554c">diagnostic ≠ acceptance</text></svg>
