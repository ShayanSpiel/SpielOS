 font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">new hypothesis / stop</text><path d="M125 375 C125 465 285 525 295 525" fill="none" stroke="#9b86b8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#future-proposed)"/><text x="160" y="470" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">measure outcomes</text><rect x="20" y="60" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="127.5" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Feedback / eval</text><text x="127.5" y="114" text-anchor="middle" font-size="13" fill="#46554c">linked run + version</text><text x="127.5" y="133" text-anchor="middle" font-size="13" fill="#46554c">classify and dedupe</text><rect x="295" y="60" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="402.5" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Triage</text><text x="402.5" y="114" text-anchor="middle" font-size="13" fill="#46554c">choose opportunity</text><text x="402.5" y="133" text-anchor="middle" font-size="13" fill="#46554c">owner / authorized reviewer</text><rect x="575" y="60" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="682.5" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Hypothesis</text><text x="682.5" y="114" text-anchor="middle" font-size="13" fill="#46554c">scope, budget, metric</text><text x="682.5" y="133" text-anchor="middle" font-size="13" fill="#46554c">expected tradeoff</text><rect x="855" y="60" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="962.5" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Freeze contract</text><text x="962.5" y="114" text-anchor="middle" font-size="13" fill="#46554c">baseline, candidate, judge</text><text x="962.5" y="133" text-anchor="middle" font-size="13" fill="#46554c">dataset + protected holdout</text><rect x="1140" y="60" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="1247.5" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Paired runs</text><text x="1247.5" y="114" text-anchor="middle" font-size="13" fill="#46554c">same cases &amp; conditions</text><text x="1247.5" y="133" text-anchor="middle" font-size="13" fill="#46554c">actual cost / time / quality</text><rect x="1140" y="265" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="1247.5" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Results</text><text x="1247.5" y="319" text-anchor="middle" font-size="13" fill="#46554c">per-case differences</text><text x="1247.5" y="338" text-anchor="middle" font-size="13" fill="#46554c">missing stays unknown</text><rect x="855" y="265" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="962.5" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Hard gates</text><text x="962.5" y="319" text-anchor="middle" font-size="13" fill="#46554c">quality / safety / coverage</text><text x="962.5" y="338" text-anchor="middle" font-size="13" fill="#46554c">reject regression</text><rect x="575" y="265" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="682.5" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Independent review</text><text x="682.5" y="319" text-anchor="middle" font-size="13" fill="#46554c">compare, accept or reject</text><text x="682.5" y="338" text-anchor="middle" font-size="13" fill="#46554c">no self-promotion</text><rect x="295" y="265" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="402.5" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Release candidate</text><text x="402.5" y="319" text-anchor="middle" font-size="13" fill="#46554c">active release preserved</text><text x="402.5" y="338" text-anchor="middle" font-size="13" fill="#46554c">until explicit acceptance</text><rect x="20" y="265" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="127.5" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Monitor outcomes</text><text x="127.5" y="319" text-anchor="middle" font-size="13" fill="#46554c">measured baseline window</text><text x="127.5" y="338" text-anchor="middle" font-size="13" fill="#46554c">drift / rollback signals</text><rect x="855" y="480" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="962.5" y="511" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Failure / no change</text><text x="962.5" y="534" text-anchor="middle" font-size="13" fill="#46554c">retain reason &amp; evidence</text><text x="962.5" y="553" text-anchor="middle" font-size="13" fill="#46554c">bounded attempts</text><rect x="575" y="480" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="682.5" y="511" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Reviewed learning</text><text x="682.5" y="534" text-anchor="middle" font-size="13" fill="#46554c">cite evaluated runs</text><text x="682.5" y="553" text-anchor="middle" font-size="13" fill="#46554c">scope / retire as needed</text><rect x="295" y="480" width="215" height="105" rx="8" fill="#f6f2fd" stroke="#c7b4de" stroke-width="2"/><text x="402.5" y="511" text-anchor="middle" font-size="17" font-weight="700" fill="#675289">Next triage</text><text x="402.5" y="534" text-anchor="middle" font-size="13" fill="#46554c">no guaranteed improvement</text><text x="402.5" y="553" text-anchor="middle" font-size="13" fill="#46554c">stop or propose another</