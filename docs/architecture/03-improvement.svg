<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 730" font-family="Arial, sans-serif" role="img" aria-label="3 · First build and editing: GODAE is the change process"><defs><marker id="arrow-build" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8b9690"/></marker><marker id="future-build" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9b86b8"/></marker></defs><path d="M235 120 H285" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="260" y="60" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">new request</text><path d="M500 120 H555" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="528" y="60" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">stage: observe</text><path d="M770 120 H825" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="798" y="60" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">stage: decide</text><path d="M1045 120 H1110" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="1078" y="60" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">stage: act</text><path d="M1220 170 V262" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="1280" y="225" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">candidate digest</text><path d="M1110 310 H1045" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="1078" y="250" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">run cases</text><path d="M825 310 H770" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="798" y="250" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">actual results</text><path d="M555 310 H500" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="528" y="250" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">release gate</text><path d="M285 310 H235" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="260" y="250" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">accepted</text><path d="M390 365 V495" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="450" y="445" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">revise / reject</text><path d="M285 545 H235" fill="none" stroke="#8b9690" stroke-width="2.5"  marker-end="url(#arrow-build)"/><text x="260" y="485" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">feedback</text><path d="M125 495 V170" fill="none" stroke="#9b86b8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#future-build)"/><text x="178" y="405" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">new bounded work</text><path d="M880 365 C880 445 1150 450 1218 365" fill="none" stroke="#9b86b8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#future-build)"/><text x="1000" y="432" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">failure → revise</text><path d="M390 495 C390 445 650 450 665 365" fill="none" stroke="#9b86b8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#future-build)"/><text x="520" y="445" text-anchor="middle" font-size="13" fill="#56645d" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">retained evidence</text><rect x="20" y="70" width="215" height="100" rx="8" fill="#f0f7eb" stroke="#a7c992" stroke-width="2"/><text x="127.5" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#527e40">Request / correction</text><text x="127.5" y="124" text-anchor="middle" font-size="13" fill="#46554c">new capability or edit</text><text x="127.5" y="143" text-anchor="middle" font-size="13" fill="#46554c">owner supplies intent</text><rect x="285" y="70" width="215" height="100" rx="8" fill="#f0f7eb" stroke="#a7c992" stroke-width="2"/><text x="392.5" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#527e40">Agree brief</text><text x="392.5" y="124" text-anchor="middle" font-size="13" fill="#46554c">need, baseline, scope</text><text x="392.5" y="143" text-anchor="middle" font-size="13" fill="#46554c">exact allowed files</text><rect x="555" y="70" width="215" height="100" rx="8" fill="#f0f7eb" stroke="#a7c992" stroke-width="2"/><text x="662.5" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#527e40">Observe</text><text x="662.5" y="124" text-anchor="middle" font-size="13" fill="#46554c">process, examples, failures</text><text x="662.5" y="143" text-anchor="middle" font-size="13" fill="#46554c">stable criterion IDs</text><rect x="825" y="70" width="220" height="100" rx="8" fill="#f0f7eb" stroke="#a7c992" stroke-width="2"/><text x="935.0" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#527e40">Decide architecture</text><text x="935.0" y="124" text-anchor="middle" font-size="13" fill="#46554c">execution + evaluation</text><text x="935.0" y="143" text-anchor="middle" font-size="13" fill="#46554c">tradeoffs &amp; test plan</text><rect x="1110" y="70" width="220" height="100" rx="8" fill="#f0f7eb" stroke="#a7c992" stroke-width="2"/><text x="1220.0" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#527e40">Act / pin candidate</text><text x="1220.0" y="124" text-anchor="middle" font-size="13" fill="#46554c">implementation + context</text><text x="1220.0" y="143" text-anchor="middle" font-size="13" fill="#46554c">rubric, cases, versions</text><a href="#run"><rect x="1110" y="262" width="220" height="103" rx="8" fill="#f0f7eb" stroke="#a7c992" stroke-width="2"/><text x="1220.0" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#527e40">Candidate experiment</text><text x="1220.0" y="316" text-anchor="middle" font-size="13" fill="#46554c">one real Run per case</text><text x="1220.0" y="335" text-anchor="middle" font-size="13" fill="#46554c">≤ 200 cases</text></a><rect x="825" y="262" width="220" height="103" rx="8" fill="#f0f7eb" stroke="#a7c992" stroke-width="2"/><text x="935.0" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#527e40">Evaluate results</text><text x="935.0" y="316" text-anchor="middle" font-size="13" fill="#46554c">expected failure matters</text><text x="935.0" y="335" text-anchor="middle" font-size="13" fill="#46554c">missing ≠ pass</text><rect x="555" y="262" width="215" height="103" rx="8" fill="#f2efff" stroke="#b8a9de" stroke-width="2"/><text x="662.5" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#605397">Release qualification</text><text x="662.5" y="316" text-anchor="middle" font-size="13" fill="#46554c">exact case coverage</text><text x="662.5" y="335" text-anchor="middle" font-size="13" fill="#46554c">required telemetry</text><rect x="285" y="262" width="215" height="103" rx="8" fill="#f2efff" stroke="#b8a9de" stroke-width="2"/><text x="392.5" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#605397">Independent decision</text><text x="392.5" y="316" text-anchor="middle" font-size="13" fill="#46554c">accept / revise / reject</text><text x="392.5" y="335" text-anchor="middle" font-size="13" fill="#46554c">not self-accept</text><a href="#run"><rect x="20" y="262" width="215" height="103" rx="8" fill="#eff6f5" stroke="#9dc6bf" stroke-width="2"/><text x="127.5" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#39746c">Accepted release</text><text x="127.5" y="316" text-anchor="middle" font-size="13" fill="#46554c">immutable; available for</text><text x="127.5" y="335" text-anchor="middle" font-size="13" fill="#46554c">production Run</text></a><rect x="285" y="495" width="215" height="100" rx="8" fill="#eff6f5" stroke="#9dc6bf" stroke-width="2"/><text x="392.5" y="526" text-anchor="middle" font-size="17" font-weight="700" fill="#39746c">Evidence / history</text><text x="392.5" y="549" text-anchor="middle" font-size="13" fill="#46554c">failed trials retained</text><text x="392.5" y="568" text-anchor="middle" font-size="13" fill="#46554c">decision and context</text><a href="#memory"><rect x="20" y="495" width="215" height="100" rx="8" fill="#fff1e9" stroke="#e5b19a" stroke-width="2"/><text x="127.5" y="526" text-anchor="middle" font-size="17" font-weight="700" fill="#a64c30">Feedback / issue</text><text x="127.5" y="549" text-anchor="middle" font-size="13" fill="#46554c">explicitly classify target</text><text x="127.5" y="568" text-anchor="middle" font-size="13" fill="#46554c">does not auto-create change</text></a></svg>
